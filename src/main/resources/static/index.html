<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
    <h1>Inventory Management System</h1>
    <div id="user-info" class="hidden">
        <span id="welcome-msg"></span>
        <button id="logout-btn">Logout</button>
    </div>
</header>

<main>
    <!-- AUTHENTICATION SECTION -->
    <section id="auth-section">
        <div class="auth-box">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
        </div>
        <div class="auth-box">
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="reg-name" placeholder="Name" required />
                <input type="email" id="reg-email" placeholder="Email" required />
                <input type="password" id="reg-password" placeholder="Password" required />
                <select id="reg-role" required>
                    <option value="USER">User</option>
                    <option value="ADMIN">Admin</option>
                </select>
                <button type="submit">Register</button>
            </form>
        </div>
    </section>

    <!-- DASHBOARD SECTION -->
    <section id="dashboard-section" class="hidden">
        <div class="controls">
            <button id="load-products-btn">Load Products</button>
            
            <div id="admin-controls" class="hidden">
                <button id="show-add-product-btn">Add New Product</button>
            </div>
        </div>

        <div id="add-product-form-container" class="hidden auth-box">
            <h3>Add Product</h3>
            <form id="add-product-form">
                <input type="text" id="prod-name" placeholder="Product Name" required />
                <input type="text" id="prod-desc" placeholder="Description" required />
                <input type="number" id="prod-price" placeholder="Price" step="0.01" required />
                <input type="number" id="prod-stock" placeholder="Stock" required />
                <input type="text" id="prod-status" placeholder="Status (e.g. ACTIVE)" required />
                <button type="submit">Save Product</button>
                <button type="button" id="cancel-add-btn">Cancel</button>
            </form>
        </div>

        <div class="products-container">
            <h2>Products</h2>
            <div id="products-list"></div>
        </div>
    </section>
</main>

<script src="/app.js"></script>
</body>
</html>
